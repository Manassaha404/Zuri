services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zuri
      POSTGRES_PASSWORD: zuri
      POSTGRES_DB: zuri
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuri -d zuri"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
  inngest:
    image: inngest/inngest:latest
    container_name: inngest
    expose:
      - "8288"
    command:
      - inngest
      - start
      - --host=0.0.0.0
      - --log-level=info
      - --postgres-uri=postgresql://zuri:zuri@postgres:5432/zuri
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
